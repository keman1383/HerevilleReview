<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hereville — Document</title>
<link rel="stylesheet" href="../style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="kicker">Town of Hereville — Document Record</div>
    <h1 id="doc-title">Loading…</h1>
    <div class="sub" id="doc-category"></div>
  </div>
  <nav class="crumbs"><a href="index.html">&larr; Document Library</a></nav>
  <div id="doc-body">Loading document…</div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const title = params.get('title') || id;
  const category = params.get('category') || '';
  document.title = 'Hereville — ' + title;
  document.getElementById('doc-title').textContent = title;
  document.getElementById('doc-category').textContent = id + (category ? ' · ' + category : '');

  fetch('content/' + id + '.md')
    .then(res => { if (!res.ok) throw new Error('missing'); return res.text(); })
    .then(text => {
      document.getElementById('doc-body').innerHTML = marked.parse(text);
    })
    .catch(() => {
      document.getElementById('doc-body').className = 'missing';
      document.getElementById('doc-body').innerHTML =
        'Content not yet added.<br><br>Drop the full text as Markdown at <code>documents/content/' + id + '.md</code>.';
    });
</script>
</body>
</html>
